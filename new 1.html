<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Leave Forms</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 30px;
    }
    h1 {
      font-size: 28px;
      color: darkblue;
    }
    form {
      margin-bottom: 50px;
      border: 1px solid #ccc;
      padding: 20px;
      border-radius: 8px;
    }
    label {
      display: block;
      margin-top: 10px;
    }
    input[type="text"], input[type="date"], input[type="time"], textarea {
      width: 100%;
      padding: 5px;
      margin-top: 5px;
      margin-bottom: 10px;
    }
    button {
      padding: 10px 20px;
      background-color: darkblue;
      color: white;
      border: none;
      border-radius: 4px;
    }
  </style>
</head>
<body>

<h1>Pending Off Form</h1>
<form action="mailto:phrh808@gmail.com" method="post" enctype="text/plain">
  <label>Staff name:</label>
  <input type="text" name="Staff Name">

  <label>Staff number:</label>
  <input type="text" name="Staff Number">

  <label>Day of Pending:</label>
  <label>Start from:</label><input type="date" name="Pending Start 1">
  <label>End to:</label><input type="date" name="Pending End 1">

  <label>Start from:</label><input type="date" name="Pending Start 2">
  <label>End to:</label><input type="date" name="Pending End 2">

  <label>Start from:</label><input type="date" name="Pending Start 3">
  <label>End to:</label><input type="date" name="Pending End 3">

  <label>Comment:</label>
  <textarea name="Comment" rows="3"></textarea>

  <button type="submit">Send</button>
</form>

<h1>Short Leave Form</h1>
<form action="mailto:phrh808@gmail.com" method="post" enctype="text/plain">
  <label>Staff name:</label>
  <input type="text" name="Staff Name">

  <label>Staff number:</label>
  <input type="text" name="Staff Number">

  <label>Day of Short Leave:</label>
  <label>Start from:</label><input type="date" name="Short Leave Start">
  <label>End to:</label><input type="date" name="Short Leave End">

  <label>Start time:</label><input type="time" name="Start Time">
  <label>Return time:</label><input type="time" name="Return Time">

  <label>Purpose:</label>
  <textarea name="Purpose" rows="2"></textarea>

  <label>Comment:</label>
  <textarea name="Comment" rows="2"></textarea>

  <button type="submit">Send</button>
</form>

<h1>Sick Leave Form</h1>
<form action="mailto:phrh808@gmail.com" method="post" enctype="text/plain">
  <label>Staff name:</label>
  <input type="text" name="Staff Name">

  <label>Staff number:</label>
  <input type="text" name="Staff Number">

  <label>Day of Sick Leave:</label>
  <label>Start from:</label><input type="date" name="Sick Start 1">
  <label>End to:</label><input type="date" name="Sick End 1">

  <label>Start from:</label><input type="date" name="Sick Start 2">
  <label>End to:</label><input type="date" name="Sick End 2">

  <label>Comment:</label>
  <textarea name="Comment" rows="3"></textarea>

  <button type="submit">Send</button>
</form>

</body>
</html>
